# OPERATOR WIRES THE REAL RESOURCES. Nothing here has been deployed or verified against Cloudflare.
name = "chadbot"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# config.ts / corpus.ts import node:fs for their file loaders (unused in the Worker).
compatibility_flags = ["nodejs_compat"]

# config/*.yaml are bundled as text modules (src/worker.ts).
[[rules]]
type = "Text"
globs = ["**/*.yaml"]
fallthrough = true

# Workers AI (generation, routed through AI Gateway).
[ai]
binding = "AI"

# KV namespace for rate-limit and monthly counters.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "a2a429ade9e042888d89da683b2a2d9c"

# AI Search instance binding named AI_SEARCH. src/retrieve.ts calls env.AI_SEARCH.search()
# DIRECTLY, which is the INSTANCE binding form (an `ai_search_namespaces` binding would
# instead require env.AI_SEARCH.get(instance).search()).
#
# The instance must already exist in the `default` namespace at deploy time; create it
# before deploying. Syntax per
# https://developers.cloudflare.com/ai-search/api/search/workers-binding/ (verified Oct 2026).
[[ai_search]]
binding = "AI_SEARCH"
instance_name = "chadbot-passkeys"

[vars]
AI_GATEWAY_ID = "chadbot"
# For generation.provider = "external" also set CF_ACCOUNT_ID (var) and CF_AIG_TOKEN (wrangler secret).
