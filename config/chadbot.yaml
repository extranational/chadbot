corpus_manifest: config/corpus.yaml
retrieval:
  max_num_results: 8
  match_threshold: 0.4      # tuned in Phase 4
# Reranking is deliberately NOT a key here. It is an instance-level AI Search setting
# (`reranking` + `reranking_model`; the live chadbot-passkeys instance runs
# @cf/baai/bge-reranker-base) and has no per-request override — AI Search silently ignores
# a `reranking` field inside retrieval options, so a key here would be inert config that
# reads as a control. Change it on the instance (PUT /ai-search/instances/chadbot-passkeys),
# and assert the instance state in the eval/smoke check so it cannot drift unnoticed.
generation:
  provider: workers-ai       # workers-ai | external
  model: "@cf/meta/llama-4-scout-17b-16e-instruct"
  max_tokens: 900
  temperature: 0.1
serving:
  rate_limit_per_ip_per_hour: 20
  monthly_query_ceiling: 3000
  # Browser origins allowed to call /api/chat (CORS). Exact match; never "*": the rate limit is
  # per-IP, so a wildcard would let any website spend the monthly budget from a visitor's browser.
  allowed_origins:
    - https://www.viewridgesecurity.com
    - https://viewridgesecurity.com
    - https://staging.viewridgesecurity.com
    - http://localhost:3000
abstain:
  message: "That isn't covered by the passkeys material I have. I can answer questions about WebAuthn, passkey registration and authentication, recovery, and phishing resistance."
