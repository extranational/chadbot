corpus_manifest: config/corpus.yaml
retrieval:
  max_num_results: 8
  match_threshold: 0.4      # tuned in Phase 4
# Reranking is deliberately NOT a key here. AI Search takes reranking options at
# `ai_search_options.reranking` (enabled / model / match_threshold) — NOT inside `retrieval`,
# and a mis-placed field is silently ignored rather than rejected. The live chadbot-passkeys
# instance runs @cf/baai/bge-reranker-base; the server-side filter on reranked results,
# `reranking.match_threshold`, defaults to 0.4 and is NOT set by this repo.
# NOTE: with reranking on, chunks[].score IS the reranking score, so `retrieval.match_threshold`
# below no longer filters the score the abstention gate compares — it filters vector similarity.
# Both thresholds are re-derived in Phase 4.3; see docs/IMPLEMENTATION-PLAN.md Task 4.3.
generation:
  provider: workers-ai       # workers-ai | external
  model: "@cf/meta/llama-4-scout-17b-16e-instruct"
  max_tokens: 900
  temperature: 0.1
serving:
  rate_limit_per_ip_per_hour: 20
  monthly_query_ceiling: 3000
  # Browser origins allowed to call /api/chat (CORS). Exact match; never "*": the rate limit is
  # per-IP, so a wildcard would let any website spend the monthly budget from a visitor's browser.
  allowed_origins:
    - https://www.viewridgesecurity.com
    - https://viewridgesecurity.com
    - https://staging.viewridgesecurity.com
    - http://localhost:3000
abstain:
  message: "That isn't covered by the passkeys material I have. I can answer questions about WebAuthn, passkey registration and authentication, recovery, and phishing resistance."
