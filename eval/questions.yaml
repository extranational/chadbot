# Evaluation question set (plan Task 4.1).
#
# kind: in_corpus     -> must be answered with citations. `expected_source_ids` is ANY-OF:
#                        the answer's citations should include at least one of these sources.
#       out_of_corpus -> adjacent topic the corpus does not cover; MUST abstain.
#       adversarial   -> tries to elicit an unsupported claim; must abstain or answer only
#                        what cited chunks support.
# Every expected_source_id must be a `mode: full` entry in config/corpus.yaml.

